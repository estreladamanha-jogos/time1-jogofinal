<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌟 Estrela da Manhã — Aventura</title>
<style>
  :root{
    --cor-ceu1:#7ec8f2;
    --cor-ceu2:#bfe8ff;
    --cor-estrela:#ffd93d;
    --cor-hud-bg:rgba(20,20,40,.55);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#0b1026;
    overflow:hidden;
    font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
    touch-action:none;
  }
  #jogoContainer{
    position:relative;
    width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#0b1026;
  }
  canvas{
    display:block;
    max-width:100%;
    max-height:100%;
    image-rendering:pixelated;
    background:linear-gradient(var(--cor-ceu1),var(--cor-ceu2));
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute;top:14px;left:14px;
    display:flex;gap:18px;align-items:center;
    background:var(--cor-hud-bg);
    padding:8px 16px;border-radius:14px;
    color:#fff;font-weight:bold;font-size:18px;
    text-shadow:0 2px 3px rgba(0,0,0,.5);
    backdrop-filter:blur(3px);
    pointer-events:none;
    user-select:none;
  }
  #vidasBox span{margin-right:2px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
  #vidasBox span.vazio{opacity:.25;}

  /* ---------- Telas (overlay) ---------- */
  .tela{
    position:absolute;inset:0;
    display:none;
    align-items:center;justify-content:center;
    flex-direction:column;
    background:rgba(5,8,25,.82);
    color:#fff;
    text-align:center;
    animation:fadeIn .5s ease;
    z-index:10;
  }
  .tela.ativa{display:flex;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .tela h1{
    font-size:2.6em;margin:0 0 6px 0;
    color:var(--cor-estrela);
    text-shadow:0 0 18px rgba(255,217,61,.8),0 3px 4px rgba(0,0,0,.5);
  }
  .tela h2{
    font-size:1.3em;font-weight:normal;margin:0 0 22px 0;
    opacity:.9;
  }
  .tela p.pontos{
    font-size:1.6em;margin-bottom:26px;
    color:#ffe27a;
  }
  .botaoJogo{
    background:linear-gradient(180deg,#ffd93d,#f2a900);
    border:none;border-radius:30px;
    padding:14px 42px;
    font-size:1.15em;font-weight:bold;
    color:#3a2400;
    cursor:pointer;
    box-shadow:0 6px 0 #b97a00, 0 8px 14px rgba(0,0,0,.4);
    transition:transform .08s ease;
    letter-spacing:.5px;
  }
  .botaoJogo:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #b97a00, 0 4px 8px rgba(0,0,0,.4);
  }

  #telaInicio h1{font-size:2.3em;}
  #telaInicio .subtitulo{
    font-size:1em;opacity:.85;margin-bottom:30px;max-width:480px;
  }

  #dicaMobile{
    position:absolute;bottom:10px;left:0;right:0;
    text-align:center;color:rgba(255,255,255,.55);
    font-size:12px;pointer-events:none;
    user-select:none;
  }

  /* ---------- Controles touch ---------- */
  #controlesTouch{
    position:absolute;bottom:18px;left:0;right:0;
    display:none;
    justify-content:space-between;
    padding:0 18px;
    pointer-events:none;
  }
  #controlesTouch.ativo{display:flex;}
  .ladoEsq,.ladoDir{display:flex;gap:12px;align-items:flex-end;pointer-events:none;}
  .btnTouch{
    width:62px;height:62px;border-radius:50%;
    background:rgba(255,255,255,.18);
    border:2px solid rgba(255,255,255,.4);
    color:#fff;font-size:26px;
    display:flex;align-items:center;justify-content:center;
    pointer-events:all;
    user-select:none;
    backdrop-filter:blur(2px);
  }
  .btnTouch:active{background:rgba(255,255,255,.4);}
  #btnAtaque{background:rgba(255,120,80,.35);border-color:rgba(255,150,100,.6);}
</style>
</head>
<body>
<div id="jogoContainer">
  <canvas id="canvas" width="960" height="540"></canvas>

  <div id="hud">
    <div id="vidasBox"></div>
    <div id="pontosBox">⭐ <span id="pontosValor">0</span></div>
  </div>

  <div id="telaInicio" class="tela ativa">
    <h1>🌟 ESTRELA DA MANHÃ</h1>
    <h2>A Aventura</h2>
    <p class="subtitulo">Fase 1 — "O Caminho da Estrela"</p>
    <button class="botaoJogo" id="btnIniciar">COMEÇAR</button>
  </div>

  <div id="telaVitoria" class="tela">
    <h1>🌟 FASE CONCLUÍDA!</h1>
    <h2>"O Caminho da Estrela"</h2>
    <p class="pontos">⭐ <span id="pontosFinais">0</span></p>
    <button class="botaoJogo" id="btnContinuar">CONTINUAR</button>
  </div>

  <div id="telaGameOver" class="tela">
    <h1 style="color:#ff6b6b;text-shadow:0 0 18px rgba(255,107,107,.8)">GAME OVER</h1>
    <button class="botaoJogo" id="btnReiniciar">JOGAR NOVAMENTE</button>
  </div>

  <div id="dicaMobile">Toque nos controles para jogar</div>

  <div id="controlesTouch">
    <div class="ladoEsq">
      <div class="btnTouch" id="btnEsq">◀</div>
      <div class="btnTouch" id="btnDir">▶</div>
    </div>
    <div class="ladoDir">
      <div class="btnTouch" id="btnAtaque">✦</div>
      <div class="btnTouch" id="btnPular">⤴</div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   🌟 ESTRELA DA MANHÃ — A AVENTURA — Fase 1: "O Caminho da Estrela"
   HTML5 Canvas 2D + JavaScript puro + Web Audio API — sem backend,
   sem bibliotecas externas. Jogo original inspirado apenas no GÊNERO
   plataforma/ação 2D (ritmo, combate, obstáculos, câmera lateral).
   Código organizado em seções para facilitar novas fases no futuro.
===================================================================== */

/* =====================================================================
   1. CONFIGURAÇÃO
===================================================================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const LARGURA = canvas.width;
const ALTURA = canvas.height;
const CHAO_Y = ALTURA - 90;      // linha base do chão
const INICIO_X = 80;             // ponto absoluto de início da fase
const VIDAS_MAX = 3;
const GRAVIDADE = 0.62;          // por frame, a 60fps (escalada por dt)

const teclas = {};

function clamp(v,min,max){ return v<min?min:(v>max?max:v); }

/* =====================================================================
   2. ÁUDIO — Web Audio API (sem arquivos externos)
===================================================================== */
const AudioSys = (() => {
  let ctxAudio = null;
  function getCtx(){
    if(!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
    if(ctxAudio.state === 'suspended') ctxAudio.resume();
    return ctxAudio;
  }
  function tom(freq, duracao, tipo='sine', volIni=0.18, atraso=0){
    try{
      const ac = getCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = tipo;
      osc.frequency.setValueAtTime(freq, ac.currentTime + atraso);
      gain.gain.setValueAtTime(volIni, ac.currentTime + atraso);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + atraso + duracao);
      osc.connect(gain); gain.connect(ac.destination);
      osc.start(ac.currentTime + atraso);
      osc.stop(ac.currentTime + atraso + duracao);
    }catch(e){}
  }
  return {
    pular(){ tom(520,0.12,'square',0.15); tom(780,0.08,'square',0.08,0.03); },
    atacar(){ tom(320,0.07,'sawtooth',0.15); },
    acerto(){ tom(700,0.06,'square',0.13); },
    dano(){ tom(160,0.25,'sawtooth',0.18); },
    inimigoDerrotado(){ tom(500,0.1,'square',0.15); tom(260,0.12,'square',0.1,0.05); },
    guardiaoAtingido(){ tom(220,0.14,'sawtooth',0.16); },
    guardiaoSlam(){ tom(90,0.3,'sawtooth',0.2); },
    checkpoint(){ tom(660,0.1,'sine',0.16); tom(880,0.14,'sine',0.14,0.08); tom(1100,0.18,'sine',0.12,0.16); },
    vitoria(){
      const notas=[523,659,784,1046,1318];
      notas.forEach((f,i)=> tom(f,0.22,'triangle',0.16,i*0.12) );
    }
  };
})();

/* =====================================================================
   3. CÂMERA
===================================================================== */
class Camera{
  constructor(){ this.x = 0; }
  seguir(alvo, limiteMundo, dt){
    const alvoX = alvo.x - LARGURA * 0.4;
    this.x += (alvoX - this.x) * clamp(0.09*dt,0,1);
    if(this.x < 0) this.x = 0;
    if(this.x > limiteMundo - LARGURA) this.x = limiteMundo - LARGURA;
  }
}

/* =====================================================================
   4. PARTÍCULAS (poeira, impacto, checkpoint, vitória)
===================================================================== */
class Particula{
  constructor(x,y,cor,vx,vy,vida,tamanho=4){
    this.x=x;this.y=y;this.cor=cor;this.vx=vx;this.vy=vy;
    this.vida=vida;this.vidaMax=vida;this.tamanho=tamanho;
  }
  atualizar(dt){
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.vy+=0.12*dt;
    this.vida-=dt;
  }
  get morta(){ return this.vida<=0; }
  desenhar(ctx,camX){
    const alpha = Math.max(this.vida/this.vidaMax,0);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.cor;
    ctx.beginPath();
    ctx.arc(this.x-camX, this.y, this.tamanho*alpha, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}
class SistemaParticulas{
  constructor(){ this.lista=[]; }
  emitir(x,y,cor,qtd=8,opts={}){
    if(this.lista.length>260) return; // limite de performance
    for(let i=0;i<qtd;i++){
      const ang = Math.random()*Math.PI*2;
      const vel = (opts.vel||2)+Math.random()*(opts.velVar||2);
      this.lista.push(new Particula(
        x,y,cor,
        Math.cos(ang)*vel*(opts.espalhar!==false?1:0.3),
        Math.sin(ang)*vel - (opts.subir||0),
        opts.vida||30 + Math.random()*10,
        opts.tamanho||(3+Math.random()*3)
      ));
    }
  }
  poeira(x,y){
    if(this.lista.length>260) return;
    this.lista.push(new Particula(x,y,'rgba(210,180,140,0.8)',(Math.random()-0.5)*1.5,-Math.random()*1,20,3));
  }
  atualizar(dt){
    this.lista.forEach(p=>p.atualizar(dt));
    this.lista = this.lista.filter(p=>!p.morta);
  }
  desenhar(ctx,camX){
    this.lista.forEach(p=>p.desenhar(ctx,camX));
  }
}
const particulas = new SistemaParticulas();

function desenharEstrela(ctx,cx,cy,pontas,rOut,rIn,cor){
  ctx.beginPath();
  for(let i=0;i<pontas*2;i++){
    const r = i%2===0?rOut:rIn;
    const ang = (Math.PI/pontas)*i - Math.PI/2;
    const x = cx+Math.cos(ang)*r;
    const y = cy+Math.sin(ang)*r;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle=cor;
  ctx.fill();
}

/* =====================================================================
   5. PLATAFORMAS E OBSTÁCULOS
===================================================================== */
// tipo: 'solido' | 'movel' | 'sumindo'
class Plataforma{
  constructor(x,y,largura,altura=24,opts={}){
    this.x=x;this.y=y;this.largura=largura;this.altura=altura;
    this.tipo = opts.tipo || 'solido';
    this.velX = opts.velX || 0;
    this.velY = opts.velY || 0;
    this.limiteMin = opts.limiteMin ?? x;
    this.limiteMax = opts.limiteMax ?? x;
    this.eixo = opts.eixo || 'x';
    this.dir = 1;
    this.deltaX = 0; // deslocamento neste frame (para o jogador acompanhar)
    // plataforma "sumindo"
    this.tempoVisivel = opts.tempoVisivel || 110;
    this.tempoInvisivel = opts.tempoInvisivel || 70;
    this.avisoFrames = opts.avisoFrames || 35;
    this.timerCiclo = opts.faseInicial || 0;
    this.visivel = true;
  }
  get solida(){ return this.tipo!=='sumindo' || this.visivel; }
  atualizar(dt){
    this.deltaX = 0;
    if(this.tipo==='movel'){
      const antesX=this.x, antesY=this.y;
      if(this.eixo==='x'){
        this.x += this.velX*this.dir*dt;
        if(this.x<this.limiteMin||this.x>this.limiteMax) this.dir*=-1;
      }else{
        this.y += this.velY*this.dir*dt;
        if(this.y<this.limiteMin||this.y>this.limiteMax) this.dir*=-1;
      }
      this.deltaX = this.x-antesX;
    } else if(this.tipo==='sumindo'){
      this.timerCiclo += dt;
      const ciclo = this.tempoVisivel+this.tempoInvisivel;
      const fase = this.timerCiclo % ciclo;
      this.visivel = fase < this.tempoVisivel;
      this.piscando = this.visivel && (this.tempoVisivel-fase) < this.avisoFrames;
    }
  }
  desenhar(ctx,camX){
    if(this.tipo==='sumindo' && !this.visivel) return;
    const sx = this.x-camX;
    if(sx+this.largura<0 || sx>LARGURA) return;
    let alpha=1;
    if(this.piscando) alpha = 0.35+0.4*Math.abs(Math.sin(this.timerCiclo*0.35));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.tipo==='sumindo' ? '#8a6fbf' : '#8a5a34';
    ctx.fillRect(sx, this.y+6, this.largura, this.altura-6);
    ctx.fillStyle = this.tipo==='sumindo' ? '#c9a6ff' : '#6fbf5e';
    ctx.fillRect(sx, this.y, this.largura, 10);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    for(let i=0;i<this.largura;i+=14){
      ctx.fillRect(sx+i, this.y, 6, 3);
    }
    ctx.globalAlpha = 1;
  }
}

class Espinho{
  constructor(x,y,largura){ this.x=x;this.y=y;this.largura=largura;this.altura=22; }
  get rect(){ return {x:this.x,y:this.y,largura:this.largura,altura:this.altura}; }
  desenhar(ctx,camX){
    const sx=this.x-camX;
    if(sx+this.largura<0||sx>LARGURA) return;
    ctx.fillStyle = '#b23a3a';
    const n = Math.max(1,Math.floor(this.largura/16));
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*16, this.y+this.altura);
      ctx.lineTo(sx+i*16+8, this.y);
      ctx.lineTo(sx+i*16+16, this.y+this.altura);
      ctx.closePath();
      ctx.fill();
    }
  }
}

class Buraco{
  constructor(x,largura){ this.x=x; this.largura=largura; }
}

// Armadilha: objeto que cai periodicamente do topo, com aviso (sombra) antes de cair
class ArmadilhaQueda{
  constructor(x){
    this.x=x; this.y=-30; this.raio=13;
    this.estado='espera'; // espera -> aviso -> caindo -> pausa
    this.timer = 40+Math.random()*40;
  }
  get rect(){ return {x:this.x-this.raio,y:this.y-this.raio,largura:this.raio*2,altura:this.raio*2}; }
  atualizar(dt){
    this.timer -= dt;
    if(this.estado==='espera' && this.timer<=0){ this.estado='aviso'; this.timer=38; }
    else if(this.estado==='aviso' && this.timer<=0){ this.estado='caindo'; this.y=-30; }
    else if(this.estado==='caindo'){
      this.y += 8.5*dt;
      if(this.y>=CHAO_Y-6){
        this.estado='pausa'; this.timer=55;
        particulas.emitir(this.x,CHAO_Y,'#caa86b',8,{vel:2,velVar:1.5,vida:16});
      }
    } else if(this.estado==='pausa' && this.timer<=0){
      this.estado='espera'; this.timer=90+Math.random()*60;
    }
  }
  desenhar(ctx,camX){
    const sx=this.x-camX;
    if(sx<-40||sx>LARGURA+40) return;
    if(this.estado==='aviso'){
      const pulso = 0.3+0.35*Math.abs(Math.sin(this.timer*0.4));
      ctx.globalAlpha=pulso;
      ctx.fillStyle='#3a2a1a';
      ctx.beginPath(); ctx.ellipse(sx,CHAO_Y+4,16,6,0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    } else if(this.estado==='caindo'){
      ctx.fillStyle='#6b4a2a';
      ctx.beginPath(); ctx.arc(sx,this.y,this.raio,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#8a6a42';
      ctx.beginPath(); ctx.arc(sx-3,this.y-3,this.raio*0.4,0,Math.PI*2); ctx.fill();
    }
  }
}

/* =====================================================================
   6. INIMIGOS — 3 tipos originais
===================================================================== */
// INIMIGO 1 — Patrulheiro: anda de um lado a outro, percebe o jogador
// (acelera perto dele), dano por contato, derrotado com 1 ataque.
class InimigoPatrulheiro{
  constructor(x,y,limiteEsq,limiteDir){
    this.x=x; this.y=y;
    this.largura=34; this.altura=38;
    this.limiteEsq=limiteEsq; this.limiteDir=limiteDir;
    this.velBase=1.3; this.dir=1;
    this.vivo=true; this.anim=Math.random()*10;
  }
  get rect(){ return {x:this.x-this.largura/2,y:this.y-this.altura,largura:this.largura,altura:this.altura}; }
  atualizar(dt, jogador){
    if(!this.vivo) return;
    this.anim+=0.15*dt;
    const perto = Math.abs(jogador.x-this.x) < 150 && !jogador.vitoriaAtiva;
    const vel = perto ? this.velBase*1.7 : this.velBase;
    this.x += vel*this.dir*dt;
    if(this.x<this.limiteEsq){this.x=this.limiteEsq;this.dir=1;}
    if(this.x>this.limiteDir){this.x=this.limiteDir;this.dir=-1;}
  }
  receberAtaque(){
    this.vivo=false;
    particulas.emitir(this.x,this.y-this.altura/2,'#ffd93d',12,{vel:3,velVar:2,vida:22});
    AudioSys.inimigoDerrotado();
  }
  desenhar(ctx,camX){
    if(!this.vivo) return;
    const sx=this.x-camX;
    if(sx<-60||sx>LARGURA+60) return;
    ctx.save();
    ctx.translate(sx,this.y);
    ctx.scale(this.dir,1);
    const bounce = Math.sin(this.anim)*3;
    ctx.fillStyle='#5b4b8a';
    ctx.beginPath();
    ctx.ellipse(0,-this.altura/2+bounce*0.2, this.largura/2, this.altura/2, 0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#8577c4';
    ctx.beginPath();
    ctx.ellipse(2,-this.altura/2+6+bounce*0.2, this.largura/3, this.altura/3,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(6,-this.altura/2-2,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2a1f4d';
    ctx.beginPath(); ctx.arc(8,-this.altura/2-2,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5b4b8a';
    ctx.beginPath();
    ctx.moveTo(-8,-this.altura+2); ctx.lineTo(-2,-this.altura-8); ctx.lineTo(4,-this.altura+2);
    ctx.fill();
    ctx.restore();
  }
}

// INIMIGO 2 — Saltador: fica parado até o jogador se aproximar, então
// salta em direção a ele dentro de sua área. Derrotado com 1 ataque.
class InimigoSaltador{
  constructor(x,y,limiteEsq,limiteDir){
    this.xBase=x; this.x=x; this.y=y; this.yChao=y;
    this.largura=32; this.altura=34;
    this.limiteEsq=limiteEsq; this.limiteDir=limiteDir;
    this.vivo=true; this.anim=0;
    this.velY=0; this.noAr=false;
    this.cooldown=0;
    this.raioDeteccao=230;
  }
  get rect(){ return {x:this.x-this.largura/2,y:this.y-this.altura,largura:this.largura,altura:this.altura}; }
  atualizar(dt, jogador){
    if(!this.vivo) return;
    this.anim+=0.12*dt;
    if(this.noAr){
      this.y += this.velY*dt;
      this.velY += GRAVIDADE*dt;
      if(this.y>=this.yChao){ this.y=this.yChao; this.noAr=false; this.velY=0; }
    } else {
      this.cooldown -= dt;
      const dist = Math.abs(jogador.x-this.x);
      if(dist < this.raioDeteccao && this.cooldown<=0 && !jogador.vitoriaAtiva){
        this.cooldown = 70;
        this.velY = -10.5;
        this.noAr = true;
        const dir = jogador.x>this.x?1:-1;
        this.velXSalto = dir*2.6;
      }
    }
    if(this.noAr && this.velXSalto){
      let novoX = this.x + this.velXSalto*dt;
      novoX = clamp(novoX, this.limiteEsq, this.limiteDir);
      this.x = novoX;
    }
  }
  receberAtaque(){
    this.vivo=false;
    particulas.emitir(this.x,this.y-this.altura/2,'#ff9d5c',12,{vel:3,velVar:2,vida:22});
    AudioSys.inimigoDerrotado();
  }
  desenhar(ctx,camX){
    if(!this.vivo) return;
    const sx=this.x-camX;
    if(sx<-60||sx>LARGURA+60) return;
    const achatado = this.noAr? 1 : 0.85+0.15*Math.abs(Math.sin(this.anim*2));
    ctx.save();
    ctx.translate(sx,this.y);
    ctx.scale(1, achatado);
    ctx.fillStyle='#e0632f';
    ctx.beginPath();
    ctx.ellipse(0,-this.altura*0.5,this.largura/2,this.altura/2,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#ffb27a';
    ctx.beginPath();
    ctx.ellipse(0,-this.altura*0.42,this.largura/3.2,this.altura/3.2,0,0,Math.PI*2);
    ctx.fill();
    // olhos grandes
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-6,-this.altura*0.58,6,0,Math.PI*2); ctx.arc(6,-this.altura*0.58,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2a1f1a';
    ctx.beginPath(); ctx.arc(-6,-this.altura*0.56,2.6,0,Math.PI*2); ctx.arc(6,-this.altura*0.56,2.6,0,Math.PI*2); ctx.fill();
    // antena
    ctx.strokeStyle='#e0632f'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,-this.altura*0.92); ctx.lineTo(0,-this.altura*1.1); ctx.stroke();
    ctx.fillStyle='#ffd93d';
    ctx.beginPath(); ctx.arc(0,-this.altura*1.1,3,0,Math.PI*2); ctx.fill();
    // pés
    ctx.fillStyle='#b8461f';
    ctx.beginPath(); ctx.ellipse(-8,-1,6,3,0,0,Math.PI*2); ctx.ellipse(8,-1,6,3,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// INIMIGO 3 — Guardião: mais resistente (2 hits), protege uma área,
// quase não se move, mas dá um golpe de área telegrafado (avisa antes).
class InimigoGuardiao{
  constructor(x,y){
    this.xBase=x; this.x=x; this.y=y;
    this.largura=46; this.altura=52;
    this.vivo=true; this.vida=2;
    this.anim=0;
    this.estado='idle'; // idle -> aviso -> golpe -> recuperando
    this.timer=90+Math.random()*40;
    this.flashDano=0;
  }
  get rect(){ return {x:this.x-this.largura/2,y:this.y-this.altura,largura:this.largura,altura:this.altura}; }
  get golpeAtivo(){ return this.estado==='golpe'; }
  get raioGolpe(){ return 80; }
  atualizar(dt, jogador){
    if(!this.vivo) return;
    this.anim += 0.08*dt;
    if(this.flashDano>0) this.flashDano -= dt;
    this.x = this.xBase + Math.sin(this.anim*0.5)*6;
    this.timer -= dt;
    if(this.estado==='idle' && this.timer<=0){
      this.estado='aviso'; this.timer=34;
    } else if(this.estado==='aviso' && this.timer<=0){
      this.estado='golpe'; this.timer=14;
      AudioSys.guardiaoSlam();
      particulas.emitir(this.x,this.y,'#7ee08a',14,{vel:3,velVar:2.5,vida:22,espalhar:true});
    } else if(this.estado==='golpe' && this.timer<=0){
      this.estado='recuperando'; this.timer=60;
    } else if(this.estado==='recuperando' && this.timer<=0){
      this.estado='idle'; this.timer=90+Math.random()*50;
    }
  }
  receberAtaque(){
    this.vida--;
    this.flashDano=14;
    if(this.vida<=0){
      this.vivo=false;
      particulas.emitir(this.x,this.y-this.altura/2,'#7ee08a',18,{vel:3.5,velVar:2.5,vida:26});
      AudioSys.inimigoDerrotado();
    } else {
      particulas.emitir(this.x,this.y-this.altura/2,'#c9ffb0',8,{vel:2,velVar:1.5,vida:16});
      AudioSys.guardiaoAtingido();
    }
  }
  desenhar(ctx,camX){
    if(!this.vivo) return;
    const sx=this.x-camX;
    if(sx<-80||sx>LARGURA+80) return;
    ctx.save();
    ctx.translate(sx,this.y);
    if(this.estado==='golpe'){
      ctx.strokeStyle='rgba(126,224,138,0.55)';
      ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(0,-4,this.raioGolpe*(1-this.timer/14), 0, Math.PI*2); ctx.stroke();
    }
    const alertaCor = this.estado==='aviso' ? `rgba(255,${80+Math.sin(this.anim*3)*40},60,0.9)` : '#3f7d3a';
    // corpo tronco
    ctx.fillStyle = this.flashDano>0 ? '#ffffff' : alertaCor;
    ctx.beginPath();
    ctx.moveTo(-18,0); ctx.lineTo(-20,-this.altura*0.55); ctx.lineTo(-10,-this.altura*0.7);
    ctx.lineTo(10,-this.altura*0.7); ctx.lineTo(20,-this.altura*0.55); ctx.lineTo(18,0);
    ctx.closePath(); ctx.fill();
    // folhagem
    ctx.fillStyle = this.flashDano>0 ? '#ffffff' : '#57a34c';
    ctx.beginPath();
    ctx.ellipse(-12,-this.altura*0.78,13,13,0,0,Math.PI*2);
    ctx.ellipse(12,-this.altura*0.8,12,12,0,0,Math.PI*2);
    ctx.ellipse(0,-this.altura*0.95,13,13,0,0,Math.PI*2);
    ctx.fill();
    // olhos
    const brilhoOlho = this.estado==='aviso'||this.estado==='golpe' ? '#fff35c' : '#fff';
    ctx.fillStyle=brilhoOlho;
    ctx.beginPath(); ctx.arc(-8,-this.altura*0.6,5.5,0,Math.PI*2); ctx.arc(8,-this.altura*0.6,5.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1d3a17';
    ctx.beginPath(); ctx.arc(-8,-this.altura*0.6,2.4,0,Math.PI*2); ctx.arc(8,-this.altura*0.6,2.4,0,Math.PI*2); ctx.fill();
    // vida restante (pequenas folhas indicadoras)
    for(let i=0;i<this.vida;i++){
      ctx.fillStyle='#ffd93d';
      ctx.beginPath(); ctx.arc(-8+i*16,-this.altura-10,4,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

/* =====================================================================
   7. CHECKPOINT
===================================================================== */
class Checkpoint{
  constructor(x,y){ this.x=x;this.y=y; this.ativado=false; this.anim=0; }
  ativar(){
    if(this.ativado) return;
    this.ativado=true;
    particulas.emitir(this.x,this.y,'#fff6c9',18,{vel:3,velVar:3,vida:30,subir:2});
    AudioSys.checkpoint();
  }
  desenhar(ctx,camX){
    const sx=this.x-camX;
    if(sx<-40||sx>LARGURA+40) return;
    this.anim+=0.08;
    const cor = this.ativado? '#ffd93d' : '#9fb8c9';
    const brilho = this.ativado ? 14+Math.sin(this.anim)*6 : 0;
    ctx.save();
    ctx.translate(sx,this.y);
    if(brilho>0){ ctx.shadowColor='#ffd93d'; ctx.shadowBlur=brilho; }
    desenharEstrela(ctx,0,0,5,16,8,cor);
    ctx.restore();
  }
}

/* =====================================================================
   8. PLAYER — "Luz", protagonista original desenhado em canvas
===================================================================== */
const ATAQUE_DURACAO = 20;       // frames de duração do golpe
const ATAQUE_JANELA_MAX = 16;    // hitbox ativa enquanto atacando está nesta faixa
const ATAQUE_JANELA_MIN = 6;

class Jogador{
  constructor(x,y){
    this.xInicio=x; this.yInicio=y;     // ponto absoluto de início da fase
    this.respawnX=x; this.respawnY=y;   // último checkpoint ativado
    this.x=x; this.y=y;
    this.largura=30; this.altura=52;
    this.velX=0; this.velY=0;
    this.noChao=false;
    this.dir=1;
    this.estado='parado';
    this.anim=0;
    this.vidas=VIDAS_MAX;
    this.pontos=0;
    this.invulneravel=0;
    this.piscar=false;
    this.atacando=0;
    this.jaAtacou=false;
    this.travado=false;
    this.morto=false;
    this.vitoriaAtiva=false;
    this.velMax=4.6;
    this.aceleracao=0.55;
    this.atrito=0.62;
    this.controleAereo=0.45;
    this.inimigosAtingidosNesteGolpe = new Set();
    this.pulRecemPressionado=false;
  }

  definirCheckpoint(x,y){ this.respawnX=x; this.respawnY=y; }

  get atacandoAtivo(){ return this.atacando>ATAQUE_JANELA_MIN && this.atacando<=ATAQUE_JANELA_MAX; }

  atualizar(mundo, dt){
    this.anim+=dt;

    if(this.vitoriaAtiva){
      this.estado='vitoria';
      this.velX*=Math.pow(0.85,dt);
      this.aplicarFisica(mundo,dt);
      return;
    }
    if(this.travado && this.estado==='morte'){
      this.velX*=Math.pow(0.9,dt);
      this.aplicarFisica(mundo,dt);
      return;
    }
    if(this.travado && this.estado==='dano'){
      this.velX*=Math.pow(0.88,dt); // amortece o knockback (corrige "voo" infinito)
      this.aplicarFisica(mundo,dt);
      this.invulneravel-=dt;
      if(this.invulneravel<=36) this.travado=false;
      this.piscar = this.invulneravel>0;
      return;
    }

    // --- Entrada ---
    let entradaX = 0;
    if(teclas['a']||teclas['arrowleft']) entradaX -= 1;
    if(teclas['d']||teclas['arrowright']) entradaX += 1;
    if(entradaX!==0) this.dir = entradaX>0?1:-1;

    const fator = this.noChao? 1 : this.controleAereo;
    if(entradaX!==0){
      this.velX += entradaX*this.aceleracao*fator*2*dt;
      this.velX = clamp(this.velX,-this.velMax,this.velMax);
    } else if(this.noChao){
      this.velX *= Math.pow(this.atrito,dt);
      if(Math.abs(this.velX)<0.05) this.velX=0;
    }

    // Pulo
    const pedirPulo = teclas['w']||teclas['arrowup']||teclas[' '];
    if(pedirPulo && this.noChao && !this.pulRecemPressionado){
      this.velY = -12.6;
      this.noChao=false;
      AudioSys.pular();
      particulas.poeira(this.x-this.dir*6, this.y-2);
      particulas.poeira(this.x+this.dir*6, this.y-2);
    }
    this.pulRecemPressionado = !!pedirPulo;

    // Ataque
    if((teclas['j']||teclas['x']) && this.atacando<=0 && !this.jaAtacou){
      this.atacando = ATAQUE_DURACAO;
      this.jaAtacou = true;
      this.inimigosAtingidosNesteGolpe.clear();
      AudioSys.atacar();
    }
    if(!(teclas['j']||teclas['x'])) this.jaAtacou=false;
    if(this.atacando>0) this.atacando=Math.max(0,this.atacando-dt);

    // poeira ao correr
    if(this.noChao && Math.abs(this.velX)>1.5 && Math.floor(this.anim)%6===0){
      particulas.poeira(this.x-this.dir*10, this.y-2);
    }

    // Estado visual
    if(this.atacando>0) this.estado='atacando';
    else if(!this.noChao) this.estado = this.velY<0?'pulando':'caindo';
    else if(Math.abs(this.velX)>2.6) this.estado='correndo';
    else if(Math.abs(this.velX)>0.2) this.estado='andando';
    else this.estado='parado';

    if(this.invulneravel>0){
      this.invulneravel-=dt;
      this.piscar = true;
    } else this.piscar=false;

    this.aplicarFisica(mundo,dt);
  }

  aplicarFisica(mundo,dt){
    this.velY += GRAVIDADE*dt;
    if(this.velY>18) this.velY=18;
    this.x += this.velX*dt;
    this.y += this.velY*dt;

    if(this.x < 20) this.x=20;
    if(this.x > mundo.largura-20) this.x = mundo.largura-20;

    this.noChao=false;
    for(const p of mundo.plataformas){
      if(!p.solida) continue;
      if(this.x+10 > p.x && this.x-10 < p.x+p.largura){
        if(this.y >= p.y && this.y <= p.y + 16 && this.velY>=0){
          this.y = p.y;
          this.velY = 0;
          this.noChao = true;
          this.x += p.deltaX;
        }
      }
    }

    let sobreBuraco=false;
    for(const b of mundo.buracos){
      if(this.x>b.x+6 && this.x<b.x+b.largura-6){ sobreBuraco=true; break; }
    }
    if(!sobreBuraco && this.y>=CHAO_Y && this.velY>=0){
      this.y=CHAO_Y; this.velY=0; this.noChao=true;
    }

    // caiu fora do mundo (buraco ou entre plataformas): SEMPRE reposiciona,
    // independente de invulnerabilidade — nunca deixa o jogador preso caindo.
    if(this.y > ALTURA + 80){
      this.caiuNoVazio();
      return;
    }

    for(const e of mundo.espinhos){
      if(this.invulneravel<=0 && colideRect(this.retangulo, e.rect)){
        this.receberDano();
      }
    }
    for(const a of mundo.armadilhas){
      if(this.invulneravel<=0 && a.estado==='caindo' && colideRect(this.retangulo, a.rect)){
        this.receberDano();
      }
    }
  }

  // Dano por contato (inimigo/espinho/armadilha): apenas recuo no lugar.
  receberDano(){
    if(this.invulneravel>0 || this.travado || this.vitoriaAtiva) return;
    this.vidas--;
    AudioSys.dano();
    particulas.emitir(this.x,this.y-this.altura/2,'#ff8a8a',10,{vel:3,velVar:2,vida:22});
    if(this.vidas<=0){
      this.vidas=0;
      this.estado='morte';
      this.travado=true;
      this.morto=true;
      this.velX=0; this.velY=-6;
      return;
    }
    this.estado='dano';
    this.travado=true;
    this.invulneravel=72;
    this.velX = -this.dir*4.5;
    this.velY = -5.5;
  }

  // Queda em buraco/vazio: reposiciona no checkpoint e perde uma vida.
  caiuNoVazio(){
    if(this.vitoriaAtiva || (this.travado && this.estado==='morte')) return;
    this.vidas = Math.max(0,this.vidas-1);
    AudioSys.dano();
    particulas.emitir(this.x, CHAO_Y-10, '#ff8a8a', 10, {vel:3,velVar:2,vida:22});
    if(this.vidas<=0){
      this.vidas=0;
      this.x = this.respawnX; this.y = this.respawnY-30;
      this.velX=0; this.velY=-4;
      this.estado='morte'; this.travado=true; this.morto=true;
      return;
    }
    this.x = this.respawnX; this.y = this.respawnY;
    this.velX=0; this.velY=0; this.noChao=true;
    this.estado='dano'; this.travado=false;
    this.invulneravel=72; this.piscar=true;
  }

  atingirVitoria(){
    if(this.vitoriaAtiva) return;
    this.vitoriaAtiva=true;
    this.velX=0; this.velY=0;
    AudioSys.vitoria();
  }

  get retangulo(){
    return { x:this.x-this.largura/2, y:this.y-this.altura, largura:this.largura, altura:this.altura };
  }
  get retanguloAtaque(){
    const alcance=32;
    return {
      x: this.dir>0? this.x+4 : this.x-alcance-4,
      y: this.y-this.altura+10,
      largura: alcance,
      altura: this.altura-20
    };
  }

  desenhar(ctx,camX){
    const sx = this.x-camX;
    if(this.piscar && Math.floor(this.anim/4)%2===0) return;
    ctx.save();
    ctx.translate(sx,this.y);
    ctx.scale(this.dir,1);

    const t = this.anim*0.18;
    let balancoPerna=0, balancoBraco=0, inclinacao=0, pulos=0;

    switch(this.estado){
      case 'andando': balancoPerna=Math.sin(t*1.3)*10; balancoBraco=Math.sin(t*1.3+Math.PI)*8; break;
      case 'correndo': balancoPerna=Math.sin(t*2)*16; balancoBraco=Math.sin(t*2+Math.PI)*14; inclinacao=6; break;
      case 'pulando': pulos=-6; balancoPerna=-8; balancoBraco=-20; break;
      case 'caindo': pulos=2; balancoPerna=10; balancoBraco=10; break;
      case 'atacando': balancoBraco=26; inclinacao=8; break;
      case 'dano': inclinacao=-14; break;
      case 'morte': inclinacao=90; break;
      case 'vitoria': balancoBraco=-28+Math.sin(this.anim*0.2)*6; pulos=Math.sin(this.anim*0.15)*4; break;
      default: balancoPerna=Math.sin(t*0.6)*2; balancoBraco=Math.sin(t*0.6)*2;
    }

    ctx.rotate(inclinacao*Math.PI/180);
    ctx.translate(0,pulos);

    const corRoupa1 = '#2d6ca8';
    const corRoupa2 = '#ffd93d';
    const corPele = '#e8b48c';
    const corCabelo = '#3b2a1f';
    const corCalca = '#354b6b';

    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0,4,16,5,0,0,Math.PI*2); ctx.fill();

    ctx.fillStyle=corCalca;
    ctx.fillRect(-7, -22+balancoPerna*0.2, 7, 22-balancoPerna*0.15);
    ctx.fillRect(1, -22-balancoPerna*0.2, 7, 22+balancoPerna*0.15);

    ctx.fillStyle=corRoupa1;
    ctx.beginPath();
    ctx.moveTo(-11,-24); ctx.lineTo(11,-24); ctx.lineTo(9,-44); ctx.lineTo(-9,-44);
    ctx.closePath(); ctx.fill();

    desenharEstrela(ctx,0,-34,5,5,2.4,corRoupa2);

    ctx.fillStyle=corRoupa1;
    ctx.save();
    ctx.translate(-8,-40);
    ctx.rotate((balancoBraco-10)*Math.PI/180);
    ctx.fillRect(-3,0,6,20);
    ctx.restore();

    ctx.save();
    ctx.translate(8,-40);
    let anguloBraco = (balancoBraco)*Math.PI/180;
    if(this.estado==='atacando') anguloBraco = -Math.PI/2.1 + Math.sin((ATAQUE_DURACAO-this.atacando)*0.35)*0.4;
    ctx.rotate(anguloBraco);
    ctx.fillStyle=corRoupa1;
    ctx.fillRect(-3,0,6,20);
    if(this.atacandoAtivo){
      ctx.fillStyle='rgba(255,217,61,0.9)';
      ctx.beginPath(); ctx.arc(0,22,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(0,22,3,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    ctx.fillStyle=corPele;
    ctx.beginPath(); ctx.arc(0,-50,10,0,Math.PI*2); ctx.fill();

    ctx.fillStyle=corCabelo;
    ctx.beginPath(); ctx.arc(0,-53,10.5,Math.PI*0.95,Math.PI*2.05); ctx.fill();
    ctx.fillRect(-10,-56,4,10);

    if(this.estado!=='morte'){
      ctx.fillStyle='#22262e';
      ctx.beginPath(); ctx.arc(4,-50,1.6,0,Math.PI*2); ctx.fill();
    } else {
      ctx.strokeStyle='#22262e'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(2,-52);ctx.lineTo(6,-48); ctx.moveTo(6,-52);ctx.lineTo(2,-48); ctx.stroke();
    }

    ctx.fillStyle=corRoupa2;
    ctx.fillRect(-10,-58,20,3);

    ctx.restore();
  }
}

/* =====================================================================
   9. COLISÕES
===================================================================== */
function colideRect(a,b){
  return a.x < b.x+b.largura && a.x+a.largura>b.x &&
         a.y < b.y+b.altura && a.y+a.altura>b.y;
}

/* =====================================================================
   10. FASE 1 — "O Caminho da Estrela" (construção por cursor sequencial)
===================================================================== */
class Fase1{
  constructor(){
    this.plataformas = [];
    this.espinhos = [];
    this.buracos = [];
    this.armadilhas = [];
    this.inimigosPatrulheiro = [];
    this.inimigosSaltador = [];
    this.inimigosGuardiao = [];
    this.checkpoints = [];
    this.decoracoes = [];
    this.montar();
    this.largura = this.cursorFinal + 900;
    this.estrelaFinalX = this.largura - 260;
    this.estrelaFinalY = CHAO_Y - 120;
    this.areaEstrelaX = this.largura - 640;
  }

  montar(){
    let c = 420; // cursor de construção

    // ============ ESTÁGIO 1 — INTRODUÇÃO ============
    this.buracos.push(new Buraco(c,70)); c+=70+170;
    this.inimigosPatrulheiro.push(new InimigoPatrulheiro(c,CHAO_Y,c-70,c+70)); c+=220;
    this.espinhos.push(new Espinho(c,CHAO_Y-22,50)); c+=50+150;
    this.buracos.push(new Buraco(c,90)); c+=90+180;

    // ============ ESTÁGIO 2 — PRIMEIROS DESAFIOS ============
    this.plataformas.push(new Plataforma(c,CHAO_Y-70,100));
    this.buracos.push(new Buraco(c,330));
    this.plataformas.push(new Plataforma(c+140,CHAO_Y-130,90));
    this.plataformas.push(new Plataforma(c+280,CHAO_Y-70,100));
    c+=380;
    this.espinhos.push(new Espinho(c,CHAO_Y-22,60)); c+=60+140;
    this.plataformas.push(new Plataforma(c,CHAO_Y-60,80,24,{tipo:'sumindo',tempoVisivel:130,tempoInvisivel:80,avisoFrames:40}));
    this.buracos.push(new Buraco(c-20,150)); c+=140;
    this.inimigosPatrulheiro.push(new InimigoPatrulheiro(c,CHAO_Y,c-90,c+90)); c+=240;

    this.checkpoints.push(new Checkpoint(c,CHAO_Y-30)); this.cpSeguroX=c; c+=170;

    // ============ ESTÁGIO 3 — COMBATE INTENSO ============
    // arena: patrulheiro + saltador combinados
    this.inimigosPatrulheiro.push(new InimigoPatrulheiro(c,CHAO_Y,c-60,c+160));
    this.inimigosSaltador.push(new InimigoSaltador(c+260,CHAO_Y,c+180,c+360));
    c+=460;
    // saltador sobre buraco: obriga combate + cuidado com o vazio
    this.buracos.push(new Buraco(c,110));
    this.inimigosSaltador.push(new InimigoSaltador(c+220,CHAO_Y,c+150,c+330));
    c+=420;
    // guardião protegendo a passagem (combo INIMIGO + área elevada)
    this.plataformas.push(new Plataforma(c-40,CHAO_Y-60,50));
    this.plataformas.push(new Plataforma(c+170,CHAO_Y-60,50));
    this.inimigosGuardiao.push(new InimigoGuardiao(c+65,CHAO_Y));
    c+=280;

    // ============ ESTÁGIO 4 — DESAFIOS DE PLATAFORMA ============
    this.buracos.push(new Buraco(c,260));
    this.plataformas.push(new Plataforma(c,CHAO_Y-90,80,24,{tipo:'movel',eixo:'y',velY:1.3,limiteMin:CHAO_Y-210,limiteMax:CHAO_Y-90}));
    c+=310;
    this.espinhos.push(new Espinho(c,CHAO_Y-22,60)); c+=60+130;
    this.plataformas.push(new Plataforma(c,CHAO_Y-70,70));
    this.plataformas.push(new Plataforma(c+140,CHAO_Y-130,70));
    this.plataformas.push(new Plataforma(c+280,CHAO_Y-70,70));
    c+=380;
    // combo: espinhos entre plataformas em sequência
    this.buracos.push(new Buraco(c,300));
    this.plataformas.push(new Plataforma(c,CHAO_Y-60,90,24,{tipo:'movel',eixo:'x',velX:1.8,limiteMin:c,limiteMax:c+210}));
    c+=340;
    // armadilha de objeto caindo, sobre trecho de chão firme
    this.armadilhas.push(new ArmadilhaQueda(c+70));
    c+=220;
    this.inimigosPatrulheiro.push(new InimigoPatrulheiro(c,CHAO_Y,c-90,c+90)); c+=240;

    this.checkpoints.push(new Checkpoint(c,CHAO_Y-30)); c+=170;

    // ============ ESTÁGIO 5 — TRECHO FINAL ============
    // combo: buraco + saltador perseguindo sobre plataforma estreita
    this.buracos.push(new Buraco(c,240));
    this.plataformas.push(new Plataforma(c+60,CHAO_Y-50,70));
    this.inimigosSaltador.push(new InimigoSaltador(c+300,CHAO_Y,c+230,c+420));
    c+=460;
    // combo: espinho + plataforma sumindo
    this.plataformas.push(new Plataforma(c,CHAO_Y-90,70,24,{tipo:'sumindo',tempoVisivel:110,tempoInvisivel:70,avisoFrames:35}));
    this.buracos.push(new Buraco(c-30,200));
    this.espinhos.push(new Espinho(c+90,CHAO_Y-22,50));
    c+=260;
    // patrulheiro numa plataforma elevada ampla, perto de um vão
    this.buracos.push(new Buraco(c,150));
    this.plataformas.push(new Plataforma(c+150,CHAO_Y-60,180));
    this.inimigosPatrulheiro.push(new InimigoPatrulheiro(c+240,CHAO_Y-60,c+160,c+310));
    c+=390;
    // guardião final antes da Estrela
    this.inimigosGuardiao.push(new InimigoGuardiao(c,CHAO_Y));
    c+=320;

    this.cursorFinal = c;

    // ============ DECORAÇÕES ============
    const largAprox = c+900;
    for(let x=0; x<largAprox; x+=260) this.decoracoes.push(new Decoracao(x+Math.random()*80, CHAO_Y-10, 'arvore', 0.8+Math.random()*0.6));
    for(let x=100; x<largAprox; x+=420) this.decoracoes.push(new Decoracao(x+Math.random()*100, 70+Math.random()*40, 'nuvem', 0.7+Math.random()*0.7));
    for(let x=0; x<largAprox; x+=180) this.decoracoes.push(new Decoracao(x+Math.random()*60, 90+Math.random()*180, 'estrelaFundo', 0.5+Math.random()*0.7));
    for(let x=300; x<largAprox-400; x+=650) this.decoracoes.push(new Decoracao(x, CHAO_Y-46, 'casa', 1));
    for(let x=500; x<largAprox-400; x+=900) this.decoracoes.push(new Decoracao(x, CHAO_Y-8, 'banco', 1));
  }

  atualizar(jogador, dt){
    this.plataformas.forEach(p=>p.atualizar(dt));
    this.armadilhas.forEach(a=>a.atualizar(dt));
    this.inimigosPatrulheiro.forEach(i=>i.atualizar(dt,jogador));
    this.inimigosSaltador.forEach(i=>i.atualizar(dt,jogador));
    this.inimigosGuardiao.forEach(i=>i.atualizar(dt,jogador));
  }

  get todosInimigos(){
    return [...this.inimigosPatrulheiro, ...this.inimigosSaltador, ...this.inimigosGuardiao];
  }
}

class Decoracao{
  constructor(x,y,tipo,escala=1){ this.x=x;this.y=y;this.tipo=tipo;this.escala=escala; this.tw=Math.random()*Math.PI*2; }
}

/* =====================================================================
   11. CENÁRIO — fundo, parallax, área da estrela
===================================================================== */
function desenharFundo(ctx,camX,fase,tempo){
  const solX = 160 - camX*0.05;
  ctx.save();
  ctx.fillStyle='rgba(255,226,122,0.95)';
  ctx.shadowColor='#ffe27a'; ctx.shadowBlur=40;
  ctx.beginPath(); ctx.arc(((solX%(LARGURA+300))+LARGURA+300)%(LARGURA+300)-150, 90, 46,0,Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.fillStyle='#bfe0a8';
  ctx.beginPath();
  ctx.moveTo(0,CHAO_Y+10);
  for(let x=0;x<=LARGURA;x+=60){
    const wx = x+camX*0.25;
    ctx.lineTo(x, CHAO_Y-30+Math.sin(wx*0.004)*22);
  }
  ctx.lineTo(LARGURA,ALTURA); ctx.lineTo(0,ALTURA); ctx.closePath(); ctx.fill();

  ctx.fillStyle='#a7d18c';
  ctx.beginPath();
  ctx.moveTo(0,CHAO_Y+20);
  for(let x=0;x<=LARGURA;x+=50){
    const wx = x+camX*0.45;
    ctx.lineTo(x, CHAO_Y-10+Math.sin(wx*0.006+2)*16);
  }
  ctx.lineTo(LARGURA,ALTURA); ctx.lineTo(0,ALTURA); ctx.closePath(); ctx.fill();

  fase.decoracoes.forEach(d=>{
    let camAjustada = camX;
    if(d.tipo==='nuvem') camAjustada = camX*0.5;
    if(d.tipo==='estrelaFundo') camAjustada = camX*0.7;
    const sx = d.x-camAjustada;
    if(sx<-100||sx>LARGURA+100) return;
    desenharDecoracao(ctx,d,sx,tempo);
  });
}

function desenharDecoracao(ctx,d,sx,tempo){
  ctx.save();
  ctx.translate(sx,d.y);
  ctx.scale(d.escala,d.escala);
  switch(d.tipo){
    case 'arvore':
      ctx.fillStyle='#7a5230'; ctx.fillRect(-5,-40,10,40);
      ctx.fillStyle='#4f9a4a'; ctx.beginPath(); ctx.arc(0,-55,26,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#5fb457'; ctx.beginPath(); ctx.arc(-12,-48,16,0,Math.PI*2); ctx.arc(12,-46,17,0,Math.PI*2); ctx.fill();
      break;
    case 'nuvem':
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.arc(20,4,14,0,Math.PI*2); ctx.arc(-18,6,13,0,Math.PI*2); ctx.fill();
      break;
    case 'estrelaFundo':{
      const piscar = 0.4+0.4*Math.abs(Math.sin(tempo*0.002+d.tw));
      ctx.globalAlpha = piscar;
      desenharEstrela(ctx,0,0,4,4,2,'#fff6c9');
      ctx.globalAlpha=1;
      break;}
    case 'casa':
      ctx.fillStyle='#e6c68a'; ctx.fillRect(-34,-46,68,46);
      ctx.fillStyle='#c9645a';
      ctx.beginPath(); ctx.moveTo(-40,-46); ctx.lineTo(0,-78); ctx.lineTo(40,-46); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#6fb6c9'; ctx.fillRect(-20,-32,14,14); ctx.fillRect(6,-32,14,14);
      ctx.fillStyle='#8a5a34'; ctx.fillRect(-7,-24,14,24);
      break;
    case 'banco':
      ctx.fillStyle='#8a5a34';
      ctx.fillRect(-18,-10,36,5); ctx.fillRect(-16,-5,4,10); ctx.fillRect(12,-5,4,10);
      break;
  }
  ctx.restore();
}

function desenharAreaEstrela(ctx,camX,fase,tempo,jogadorVenceu){
  const sx = fase.estrelaFinalX-camX;
  if(sx<-150||sx>LARGURA+150) return;
  const y = fase.estrelaFinalY;
  ctx.fillStyle='#e8d9a0';
  ctx.beginPath(); ctx.ellipse(sx,CHAO_Y+6,70,16,0,0,Math.PI*2); ctx.fill();
  const pulso = 18+Math.sin(tempo*0.004)*8 + (jogadorVenceu?20:0);
  ctx.save();
  ctx.translate(sx,y);
  ctx.rotate(tempo*0.0006);
  ctx.strokeStyle='rgba(255,217,61,0.35)'; ctx.lineWidth=4;
  for(let i=0;i<8;i++){
    ctx.save(); ctx.rotate(i*Math.PI/4);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-60-pulso); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  ctx.save();
  ctx.translate(sx,y);
  ctx.shadowColor='#ffd93d'; ctx.shadowBlur = pulso;
  desenharEstrela(ctx,0,Math.sin(tempo*0.003)*6,5,42,20,'#ffe27a');
  ctx.shadowBlur=0;
  desenharEstrela(ctx,0,Math.sin(tempo*0.003)*6,5,24,11,'#fff8d6');
  ctx.restore();
}

function desenharChaoComBuracos(ctx,camX,fase){
  const buracosOrdenados = [...fase.buracos].sort((a,b)=>a.x-b.x);
  let cursor = 0;
  const segmentos=[];
  buracosOrdenados.forEach(b=>{
    if(b.x>cursor) segmentos.push([cursor,b.x]);
    cursor = Math.max(cursor,b.x+b.largura);
  });
  segmentos.push([cursor, fase.largura]);

  segmentos.forEach(([ini,fim])=>{
    const sx = ini-camX, sw = fim-ini;
    if(sx+sw<0||sx>LARGURA) return;
    ctx.fillStyle='#8a5a34'; ctx.fillRect(sx, CHAO_Y+10, sw, ALTURA-CHAO_Y);
    ctx.fillStyle='#6fbf5e'; ctx.fillRect(sx, CHAO_Y, sw, 14);
    ctx.fillStyle='rgba(255,255,255,0.15)';
    for(let x=0;x<sw;x+=18) ctx.fillRect(sx+x, CHAO_Y, 8,4);
  });
}

/* =====================================================================
   12. VIDAS / HUD
===================================================================== */
function atualizarHUD(jogador){
  const vidasBox = document.getElementById('vidasBox');
  vidasBox.innerHTML = '';
  for(let i=0;i<VIDAS_MAX;i++){
    const s = document.createElement('span');
    s.textContent = '❤️';
    if(i>=jogador.vidas) s.classList.add('vazio');
    vidasBox.appendChild(s);
  }
  document.getElementById('pontosValor').textContent = jogador.pontos;
}

function trocarTela(idAtiva){
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
  if(idAtiva) document.getElementById(idAtiva).classList.add('ativa');
}

/* =====================================================================
   13. GAME — orquestrador geral (fase, vitória, game over)
===================================================================== */
class Game{
  constructor(){
    this.camera = new Camera();
    this.iniciarNovaTentativa();
    this.tempo=0;
    this.estadoTela='inicio'; // inicio, jogando, vitoria, gameover
  }

  // Reinício TOTAL: nova fase, novo jogador do zero. Usado por
  // "COMEÇAR" e "JOGAR NOVAMENTE" — corrige o bug em que reiniciar
  // após Game Over voltava no último checkpoint em vez do início.
  iniciarNovaTentativa(){
    this.fase = new Fase1();
    this.jogador = new Jogador(INICIO_X, CHAO_Y);
    this.camera.x = 0;
    this.timerVitoria = 0;
    this.timerMorte = 0;
    particulas.lista.length = 0;
    atualizarHUD(this.jogador);
  }

  atualizar(dt){
    this.tempo += dt;
    if(this.estadoTela!=='jogando') return;
    const j = this.jogador;
    j.atualizar(this.fase, dt);
    this.fase.atualizar(j, dt);
    particulas.atualizar(dt);
    this.camera.seguir(j, this.fase.largura, dt);

    // checkpoints
    this.fase.checkpoints.forEach(c=>{
      if(!c.ativado && Math.abs(j.x-c.x)<26 && j.y>c.y-60){
        c.ativar();
        j.definirCheckpoint(c.x, CHAO_Y);
        j.pontos += 50;
      }
    });

    // combate: jogador x inimigos
    this.fase.todosInimigos.forEach(ini=>{
      if(!ini.vivo) return;
      const atingidoAgora = j.atacandoAtivo && !j.inimigosAtingidosNesteGolpe.has(ini) && colideRect(j.retanguloAtaque, ini.rect);
      if(atingidoAgora){
        j.inimigosAtingidosNesteGolpe.add(ini);
        ini.receberAtaque();
        j.pontos += ini instanceof InimigoGuardiao ? 80 : 100;
        AudioSys.acerto();
      } else if(ini.vivo && colideRect(j.retangulo, ini.rect)){
        j.receberDano();
      }
    });

    // golpe de área do guardião
    this.fase.inimigosGuardiao.forEach(g=>{
      if(g.vivo && g.golpeAtivo && j.invulneravel<=0){
        const dist = Math.abs(j.x-g.x);
        if(dist < g.raioGolpe && j.y >= g.y-70) j.receberDano();
      }
    });

    // vitória: área da estrela
    if(!j.vitoriaAtiva && j.x > this.fase.estrelaFinalX-40){
      j.atingirVitoria();
      particulas.emitir(j.x, j.y-j.altura, '#ffe27a', 30, {vel:4,velVar:3,vida:50,subir:2});
    }
    if(j.vitoriaAtiva){
      this.timerVitoria += dt;
      if(this.timerVitoria>90) this.mostrarVitoria();
    }

    if(j.morto){
      this.timerMorte += dt;
      if(this.timerMorte>70) this.mostrarGameOver();
    } else this.timerMorte=0;

    atualizarHUD(j);
  }

  mostrarVitoria(){
    this.estadoTela='vitoria';
    document.getElementById('pontosFinais').textContent = this.jogador.pontos;
    trocarTela('telaVitoria');
  }
  mostrarGameOver(){
    this.estadoTela='gameover';
    trocarTela('telaGameOver');
  }

  desenhar(){
    ctx.clearRect(0,0,LARGURA,ALTURA);
    const camX = this.camera.x;
    desenharFundo(ctx,camX,this.fase,this.tempo);

    desenharChaoComBuracos(ctx,camX,this.fase);

    this.fase.espinhos.forEach(e=>e.desenhar(ctx,camX));
    this.fase.armadilhas.forEach(a=>a.desenhar(ctx,camX));
    this.fase.plataformas.forEach(p=>p.desenhar(ctx,camX));
    this.fase.checkpoints.forEach(c=>c.desenhar(ctx,camX));

    const revelarEstrela = this.jogador.x > this.fase.areaEstrelaX;
    if(revelarEstrela) desenharAreaEstrela(ctx,camX,this.fase,this.tempo,this.jogador.vitoriaAtiva);

    this.fase.todosInimigos.forEach(i=>i.desenhar(ctx,camX));

    particulas.desenhar(ctx,camX);
    this.jogador.desenhar(ctx,camX);

    const grad = ctx.createRadialGradient(LARGURA/2,ALTURA/2,LARGURA*0.35,LARGURA/2,ALTURA/2,LARGURA*0.7);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(1,'rgba(0,0,0,0.18)');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,LARGURA,ALTURA);
  }
}

/* =====================================================================
   14. ENTRADA (teclado + touch)
===================================================================== */
window.addEventListener('keydown', e=>{
  teclas[e.key.toLowerCase()] = true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener('keyup', e=>{
  teclas[e.key.toLowerCase()] = false;
});

function configurarBotaoTouch(id,tecla){
  const el = document.getElementById(id);
  const ligar = ev=>{ ev.preventDefault(); teclas[tecla]=true; };
  const desligar = ev=>{ ev.preventDefault(); teclas[tecla]=false; };
  el.addEventListener('touchstart',ligar,{passive:false});
  el.addEventListener('touchend',desligar,{passive:false});
  el.addEventListener('touchcancel',desligar,{passive:false});
  el.addEventListener('mousedown',ligar);
  el.addEventListener('mouseup',desligar);
  el.addEventListener('mouseleave',desligar);
}
configurarBotaoTouch('btnEsq','a');
configurarBotaoTouch('btnDir','d');
configurarBotaoTouch('btnPular',' ');
configurarBotaoTouch('btnAtaque','j');

if('ontouchstart' in window){
  document.getElementById('controlesTouch').classList.add('ativo');
} else {
  document.getElementById('dicaMobile').style.display='none';
}

/* =====================================================================
   15. LOOP PRINCIPAL — requestAnimationFrame + delta time
===================================================================== */
const jogo = new Game();
let ultimoTempo = null;

function loop(timestamp){
  if(ultimoTempo===null) ultimoTempo = timestamp;
  const deltaMs = timestamp - ultimoTempo;
  ultimoTempo = timestamp;
  const dt = clamp(deltaMs/(1000/60), 0.0001, 2.5); // normalizado a 60fps, protegido de saltos grandes

  jogo.atualizar(dt);
  jogo.desenhar();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.getElementById('btnIniciar').addEventListener('click', ()=>{

});

});
